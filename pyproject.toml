[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codewiki"
version = "0.1.0"
description = "Business-oriented knowledge base generator for source code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # CLI
    "typer>=0.12",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    # LLM / HTTP
    "httpx>=0.27",
    # Concurrency
    "anyio>=4.4",
    # Templates
    "Jinja2>=3.1",
    # Parsing (Phase 1)
    "tree-sitter>=0.23",
    # Git (Phase 1)
    "GitPython>=3.1",
    # Keyword search (Phase 4)
    "Whoosh>=2.7",
    # Graph (Phase 7 / W3)
    "networkx>=3.1",
    # Viewer (Phase 6)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "markdown-it-py>=3.0",
    "rich>=13.7",
]

[project.optional-dependencies]
vectors = [
    "faiss-cpu>=1.8",
    "tiktoken>=0.7",
]
tantivy = [
    "tantivy>=0.22",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
codewiki = "codewiki.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["codewiki*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
